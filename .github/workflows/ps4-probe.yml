name: PS4 probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            mkdir -p /tmp/tc && cd /tmp/tc
            gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern 'toolchain-llvm-18.tar.gz'
            tar xzf toolchain-llvm-18.tar.gz
            T=/tmp/tc/OpenOrbis/PS4Toolchain
            ls $T; ls $T/bin $T/bin/linux; ls $T/lib | grep -i "SystemService\|libc\|kernel\|crt1\|libSceLibcInternal"
            echo ---- header
            grep -n "WebBrowser\|Launch\|^#include" $T/include/orbis/SystemService.h | head -30
            echo ---- samples in toolchain
            ls $T/samples | head
            echo ---- deps
            which clang ld.lld; clang --version | head -1
          } 2>&1 | head -100 > probe.txt
          python3 -c "import sys; t=open('probe.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::notice title=probe::'+t)"
